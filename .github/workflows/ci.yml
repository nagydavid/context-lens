name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      # Pinned to full commit SHAs: the repo's Actions policy requires SHA pinning.
      # 11d5960a = actions/checkout v4 (2026-07-16), 49933ea5 = actions/setup-node v4 (2025-04-02).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # PDF fixtures need the pdftotext binary; the runner image does not ship it.
      - name: Install poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      # Tests run from dist, so the build must succeed first; a failed build must not
      # be mistaken for a passing zero-test run.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
