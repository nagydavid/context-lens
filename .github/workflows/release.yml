name: Release

# Publish flow: bump "version" in package.json, merge to master, then push a tag "v<version>".
# The tag must match package.json exactly; the job refuses to publish otherwise.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run build, tests and npm publish --dry-run only (no publish, no GitHub release)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance attestation
    steps:
      # Pinned to full commit SHAs: the repo's Actions policy requires SHA pinning.
      # 11d5960a = actions/checkout v4 (2026-07-16), 49933ea5 = actions/setup-node v4 (2025-04-02).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg_version}"
            exit 1
          fi
          echo "Releasing ${pkg_version}"

      - name: Install poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check package contents
        run: npm pack --dry-run

      - name: Publish to npm (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run --access public

      # Trusted publishing (OIDC) needs npm >= 11.15.0; pinned for a deterministic toolchain.
      - name: Upgrade npm
        if: github.event_name == 'push' || !inputs.dry_run
        run: npm install -g npm@11.21.1

      # Trusted publishing is configured on @davidnagy/paradoc (trust id f4406f3e-e683-4777-aaab-27be1eaa3144,
      # permissions publish+stage publish) for this repo and workflow file, so the OIDC token from
      # id-token: write publishes directly with provenance and no interactive 2FA.
      - name: Publish to npm
        if: github.event_name == 'push' || !inputs.dry_run
        run: npm publish --provenance --access public

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
